name: ccavenue_india_sdk_flutter
description: "A Flutter plugin for integrating CCAvenue Payment Gateway in Android and iOS applications. Supports environments and customization."
version: 2.1.0
homepage: https://www.ccavenue.com/

environment:
  sdk: ^3.10.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
 
flutter:
 
  plugin:
    platforms:
      android:
        package: com.ccavenue.ccavenue_india_sdk_flutter
        pluginClass: CcavenueIndiaSdkPlugin
      ios:
        pluginClass: CcavenueIndiaSdkPlugin
